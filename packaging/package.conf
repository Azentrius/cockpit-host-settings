# What tools/build-packages.sh needs to know about this package (sourced by sh).
# SPDX-License-Identifier: Apache-2.0

NAME=cockpit-host-settings
SUMMARY="Cockpit page: target profile, watchdog and ntfy or e-mail messages on findings and coverage gaps"
DESCRIPTION="Reads the status of the Azentrius Cockpit add-ons on this server every 5 minutes, through the status contract they share, and sends a message through ntfy, e-mail (the local mail server) or both when a finding turns to a warning or a danger, and when it is OK again. With a target profile (the server's roles and the add-ons and checks they expect) it also tells when an expected check can no longer be made, and when it can again; Status Board reads the profile from it. The messages hold only what the add-ons report and the server's name. The page sets up the channels and the profile, shows the commands the ntfy server needs for this server's user, topic and token, checks that the topic is closed to anyone without a login, and shows whether each channel accepted its last message. An external watchdog (Healthchecks or Uptime Kuma) can get a signal after every run, so that a notifier that stops or fails is noticed. Neither the watchdog nor a channel can tell whether someone read a message. The notifier runs as a user of its own, never as root."
HOMEPAGE=https://github.com/Azentrius/cockpit-host-settings
MAINTAINER="Azentrius <support@azentrius.com>"
LICENSE="Apache-2.0 AND OFL-1.1 AND CC-BY-4.0"

# One dependency per line, in each format's syntax. iproute2 (ss) tells whether a mail server
# listens on localhost:25. The minimums (README, Requirements): Cockpit 264 (also in
# plugin/manifest.json), Python 3.8, systemd 247 (LoadCredential=).
DEB_DEPENDS="cockpit-bridge (>= 264)
python3 (>= 3.8)
systemd (>= 247)
iproute2"
RPM_REQUIRES="cockpit-bridge >= 264
python3 >= 3.8
systemd >= 247
iproute"

# What the package owns below the staged root (directories are taken whole).
FILES="/usr/share/cockpit/host-settings
/usr/lib/cockpit-host-settings
/usr/lib/systemd/system/cockpit-host-settings-notify.service
/usr/lib/systemd/system/cockpit-host-settings-notify.timer
/usr/lib/systemd/system/cockpit-host-settings-test@.service
/usr/lib/sysusers.d/cockpit-host-settings.conf
%dir /etc/cockpit-host-settings
/usr/share/metainfo/de.azentrius.host_settings.metainfo.xml
/usr/share/doc/cockpit-host-settings"
