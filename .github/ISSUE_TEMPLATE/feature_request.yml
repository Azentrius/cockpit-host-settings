# SPDX-License-Identifier: Apache-2.0
name: Feature request
description: Suggest a channel, a setting or an improvement for Host Settings.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the open issues first. This issue is public: leave out host names, credentials and
        other private data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you miss, or what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Host Settings do, and how would you set it up on the page?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you have considered.
  - type: dropdown
    id: help
    attributes:
      label: Would you help?
      options:
        - "Yes, with a pull request"
        - "Yes, by testing it on my server"
        - "No"
    validations:
      required: false
