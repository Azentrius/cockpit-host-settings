# SPDX-License-Identifier: Apache-2.0
name: Bug report
description: Something in Host Settings does not work as described, or a message came that should not, or did not come.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems do not belong here.** Report them privately as described in
        [SECURITY.md](https://github.com/Azentrius/cockpit-host-settings/blob/main/SECURITY.md).

        This issue is public. Remove tokens, passwords, topics, host names, IP addresses, e-mail
        addresses and other private data from everything you paste.
  - type: input
    id: version
    attributes:
      label: Add-on version
      description: >-
        Shown in the page footer ("Host Settings X.Y.Z"), or the output of `dpkg -s cockpit-host-settings`.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: cockpit
    attributes:
      label: Cockpit version
      description: In Cockpit under Help › About Web Console, or `cockpit-bridge --version`.
    validations:
      required: true
  - type: input
    id: channel
    attributes:
      label: Channel
      description: ntfy (which server version, if you know it), e-mail (which mail server), or both.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: For a message, say which add-on and finding, and what the message said.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: >-
        For example `journalctl -u cockpit-host-settings-notify.service -n 20`, or the output of
        `/usr/lib/cockpit-host-settings/host-settings.py status`.
        **Before pasting, remove tokens, topics, host names, IP addresses, e-mail addresses and any
        other private data.**
      render: shell
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Private data
      options:
        - label: >-
            I have removed tokens, passwords and any other secrets or private data from everything
            above.
          required: true
