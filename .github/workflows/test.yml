name: test

# A pull request runs once (pull_request), a push only on main, where the release looks for its
# run; any other branch by hand (Actions › test › Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The release the upgrade test (test/e2e/upgrade.sh) installs first: 0.1.0, the first one, the
# oldest a server may run (before the watchdog, findings and target profiles), so the test goes
# over every change of the settings and of last.json since. Its packages as its GitHub release
# serves them, pinned by SHA-256 (test/e2e/release-asset.sh also checks them against the release's
# SHA256SUMS).
env:
  PREVIOUS_TAG: v0.1.0
  PREVIOUS_DEB: cockpit-host-settings_0.1.0-1_all.deb
  PREVIOUS_DEB_SHA256: 0449c2a216a5ce8475f2f57dbb0ba0d6bc464197abc64d8c2fba064d6d7ba3ae
  PREVIOUS_RPM: cockpit-host-settings-0.1.0-1.noarch.rpm
  PREVIOUS_RPM_SHA256: 295c86fa2f84b46cf9302baa062c8bf1cf64817e3e1d96a5e11d8d4e767f5a42

jobs:
  # Everything that runs without a server: lint, the offline tests, the packages (built twice to
  # the same bytes), installed on Debian and Fedora with a run of the notifier as its own user and
  # the status verb as nobody (on Rocky Linux and AlmaLinux: job install), and the preview in a
  # browser (no JavaScript errors, no sideways scrolling on a phone) with the screenshots for the
  # README (artifact "screenshots").
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check tools (pinned in test/requirements.txt)
        run: pip install -r test/requirements.txt
      - name: Lint (shellcheck, ruff, systemd units and their hardening)
        run: make lint
      # The notifier against Status Board's own fixtures and recorded answers of an ntfy server,
      # whole runs with stand-ins, the verbs of the page; the page under jsdom; texts, files,
      # design, version, the pinned board fixtures.
      - name: Offline tests
        run: make check
      - name: Packages (.deb, .rpm) with valid AppStream data, built twice to the same bytes
        run: |
          sudo sh tools/apt-update.sh
          sudo apt-get install -y -qq --no-install-recommends rpm appstream > /dev/null
          appstreamcli validate --no-net packaging/*.metainfo.xml
          make packages
          (cd dist && sha256sum *.deb *.rpm) > first.sha256
          rm -rf dist && make packages > /dev/null
          (cd dist && sha256sum -c ../first.sha256)
      - name: Package dependencies name the minimum versions (Cockpit 264, Python 3.8, systemd 247)
        run: |
          test "$(dpkg-deb -f dist/*.deb Depends)" = "cockpit-bridge (>= 264), python3 (>= 3.8), systemd (>= 247), iproute2"
          rpm -qp --requires dist/*.rpm | grep -qx 'cockpit-bridge >= 264'
          rpm -qp --requires dist/*.rpm | grep -qx 'python3 >= 3.8'
          rpm -qp --requires dist/*.rpm | grep -qx 'systemd >= 247'
      - name: Install and remove the .deb on Debian 13, the .rpm on Fedora 43 (test/package-install.sh)
        run: |
          for kind_image in deb:debian:13 rpm:fedora:43; do
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/test/package-install.sh:/package-install.sh:ro" \
              -v "$PWD/tools/dnf.sh:/dnf.sh:ro" "${kind_image#*:}" sh /package-install.sh "${kind_image%%:*}"
          done
      # Only the browser, from Playwright's CDN (seconds). Its system packages (--with-deps: fonts,
      # xvfb) come by apt from the Ubuntu mirror, which was slow enough to hang the job for ten
      # minutes (PR #4) and, cut off by the time limit, left apt-get holding the dpkg lock (PR #7).
      # The runner image brings what Chromium needs (it has Google Chrome); the preview step after
      # this one shows if anything is missing. Each try gets four minutes, a hung one a second try.
      - name: Browser for the preview
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            timeout --kill-after=10s 4m python -m playwright install chromium && exit 0
            echo "::warning::playwright install failed or hung (try $try)"
          done
          exit 1
      - name: Preview in a browser (no JavaScript errors, no sideways scrolling on a phone) and screenshots
        timeout-minutes: 5
        run: |
          python tools/preview/build.py
          python tools/preview/shoot.py test/shots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test/shots/

  # The .rpm on the RHEL rebuilds Rocky Linux and AlmaLinux, 9 and 10, beyond the test job's
  # Debian 13 and Fedora 43, with the same checks (test/package-install.sh). No Cockpit or systemd
  # runs there, so an installed package is not yet a tested system.
  # dnf runs through tools/dnf.sh, with time limits and three tries: on AlmaLinux the first dnf
  # install of a job once took almost 14 minutes, and once ran until the job's time limit.
  install:
    name: install (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["rockylinux/rockylinux:9", "rockylinux/rockylinux:10", "almalinux:9", "almalinux:10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packages
        run: |
          sudo sh tools/apt-update.sh
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make packages
      - name: Install, check and remove on ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/test/package-install.sh:/package-install.sh:ro" \
            -v "$PWD/tools/dnf.sh:/dnf.sh:ro" "$IMAGE" sh -c '. /etc/os-release; echo "$PRETTY_NAME"; exec sh /package-install.sh rpm'

  # The oldest Python the helpers support (README, Requirements): the helper tests on 3.8.
  python-min:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Helper tests on Python 3.8
        run: |
          docker run --rm -v "$PWD:/src" -w /src/test python:3.8-slim sh -ec '
            python3 --version
            for t in notify_test.py run_test.py helper_test.py heartbeat_test.py; do
              python3 -B "$t" > "/tmp/$t.log" 2>&1 || { cat "/tmp/$t.log"; exit 1; }; echo "PASS $t"; done'

  # On this throw-away runner: the package with its real units, a real ntfy server (deny-all, a
  # user with write-only access, a reader) and postfix for local mail (test/e2e/run.sh). The
  # commands the page shows run on the server as shown; "Check connection" against a closed and an
  # open topic; the first run's summary, a change, no message without one; the status verb as
  # nobody; the watchdog against a stand-in for both protocols and against a real Uptime Kuma
  # (below); the token and the watchdog's address in no file but their own and in no log. The
  # steps and the raw answers are in the artifact e2e-session.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # The watchdog's real counterpart: Uptime Kuma, pinned by digest (the multi-arch index of
      # louislam/uptime-kuma:2.5.7-slim, released 2026-10-23). Its first user, its password and
      # the push monitor are made in the container through Uptime Kuma's own API (test/e2e/kuma.py)
      # and never leave the runner. Raise it together with the Uptime Kuma that watches the servers.
      KUMA_VERSION: "2.5.7"
      KUMA_IMAGE: docker.io/louislam/uptime-kuma:2.5.7-slim@sha256:4837e2b531b118d2fad24430fabed1488b14542f03b2bebf035497271b3a1ee8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The package of this build
        run: |
          sudo sh tools/apt-update.sh
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make packages
      - name: ntfy, postfix, the add-on and the watchdog (test/e2e/run.sh)
        run: sudo env OUT="$PWD/e2e-session" KUMA_IMAGE="$KUMA_IMAGE" KUMA_VERSION="$KUMA_VERSION" sh test/e2e/run.sh dist/*.deb
      - name: Report and logs
        if: always()
        run: |
          # The script ran as root: the folder is root's until it is handed back.
          sudo mkdir -p e2e-session
          sudo chown -R "$(id -u)" e2e-session
          [ ! -f e2e-session/report.md ] || cat e2e-session/report.md >> "$GITHUB_STEP_SUMMARY"
          sudo journalctl --no-pager -n 2000 -u 'cockpit-host-settings*' > e2e-session/journal.txt || true
          sudo docker logs ntfy > e2e-session/ntfy.log 2>&1 || true
      - name: Keep the report and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-session
          path: e2e-session/

  # The update from the previous release (PREVIOUS_* above) on this throw-away runner
  # (test/e2e/upgrade.sh): the .deb of that release set up with ntfy, the token and the timer tells
  # a warning of the stand-in add-on; the package of this build goes over it with apt. Settings,
  # token and timer stay, heartbeat.conf comes empty, last.json is read on without a message,
  # findings of the item told are taken as told and a danger is told once, a target profile set
  # afterwards works; removing the package keeps the settings and removes the state. The steps
  # and the raw answers are in the artifact upgrade-session.
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The package of this build
        run: |
          sudo sh tools/apt-update.sh
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make packages
      - name: The .deb of the previous release (test/e2e/release-asset.sh)
        run: sh test/e2e/release-asset.sh "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$PREVIOUS_DEB" "$PREVIOUS_DEB_SHA256" previous
      - name: ntfy, the previous release set up, this build over it (test/e2e/upgrade.sh)
        run: sudo env OUT="$PWD/upgrade-session" sh test/e2e/upgrade.sh "previous/$PREVIOUS_DEB" dist/*.deb
      - name: Report and logs
        if: always()
        run: |
          # The script ran as root: the folder is root's until it is handed back.
          sudo mkdir -p upgrade-session
          sudo chown -R "$(id -u)" upgrade-session
          [ ! -f upgrade-session/report.md ] || cat upgrade-session/report.md >> "$GITHUB_STEP_SUMMARY"
          sudo journalctl --no-pager -n 2000 -u 'cockpit-host-settings*' > upgrade-session/journal.txt || true
          sudo docker logs ntfy > upgrade-session/ntfy.log 2>&1 || true
      - name: Keep the report and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-session
          path: upgrade-session/

  # The same end-to-end test (suite e2e) and the same upgrade test (suite upgrade, the .rpm of the
  # previous release first) with the .rpm in a Rocky Linux VM with SELinux enforcing (tools/vm.sh:
  # the pinned cloud image under KVM on this runner), Podman with podman-docker standing in for
  # Docker for the ntfy server. The job fails on every SELinux denial between the mark after the
  # set-up and the end of the test. A pilot: not yet part of the required check e2e.
  e2e-el:
    name: ${{ matrix.suite }} (${{ matrix.os }}, SELinux enforcing)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [rocky-9, rocky-10]
        suite: [e2e, upgrade]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The package of this build, QEMU and cloud-init's seed tool
        run: |
          sudo sh tools/apt-update.sh
          sudo apt-get install -y -qq --no-install-recommends rpm qemu-system-x86 qemu-utils cloud-image-utils > /dev/null
          make packages
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Which cloud image
        id: image
        env:
          OS: ${{ matrix.os }}
        run: echo "name=$(sh tools/vm.sh image "$OS")" >> "$GITHUB_OUTPUT"
      - name: The cloud image (kept between runs by its pinned name; tools/vm.sh checks its SHA-256)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/azentrius-vm
          key: vm-${{ steps.image.outputs.name }}
      - name: The .rpm of the previous release (test/e2e/release-asset.sh)
        if: matrix.suite == 'upgrade'
        run: sh test/e2e/release-asset.sh "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$PREVIOUS_RPM" "$PREVIOUS_RPM_SHA256" previous
      - name: Boot ${{ matrix.os }} (tools/vm.sh)
        env:
          OS: ${{ matrix.os }}
        run: sh tools/vm.sh start "$OS"
      - name: Podman for the ntfy server, the packages and the test into the machine
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          sh tools/vm.sh root dnf install -y -q podman podman-docker openssl
          sh tools/vm.sh root touch /etc/containers/nodocker
          sh tools/vm.sh copy /root/e2e dist/*.rpm test/e2e/run.sh test/e2e/upgrade.sh test/e2e/watchdog.py
          if [ "$SUITE" = upgrade ]; then sh tools/vm.sh copy /root/e2e/previous "previous/$PREVIOUS_RPM"; fi
      - name: The SELinux check catches a denial on purpose; then the mark in the audit log
        run: |
          sh tools/vm.sh avc-selftest
          sh tools/vm.sh avc-mark
      - name: The test in the machine (test/e2e/run.sh or upgrade.sh as root)
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case $SUITE in
            e2e) sh tools/vm.sh root sh -c "'cd /root/e2e && OUT=/root/e2e/session sh run.sh /root/e2e/*.rpm'" ;;
            upgrade) sh tools/vm.sh root sh -c "'cd /root/e2e && OUT=/root/e2e/session sh upgrade.sh /root/e2e/previous/$PREVIOUS_RPM /root/e2e/*.rpm'" ;;
            *) echo "unknown suite $SUITE"; exit 1 ;;
          esac
      - name: No SELinux denials during the test
        run: sh tools/vm.sh avc-check
      - name: Report and logs
        if: always()
        env:
          OS: ${{ matrix.os }}
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p e2e-el
          sh tools/vm.sh fetch e2e-el /root/e2e/session || true
          sh tools/vm.sh logs e2e-el || true
          if [ -f e2e-el/root/e2e/session/report.md ]; then
            { echo "### $SUITE, $OS"; cat e2e-el/root/e2e/session/report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the report and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite }}-${{ matrix.os }}
          path: e2e-el/

  # Secrets in the files and in the whole history (gitleaks, pinned with its checksum). The
  # findings are redacted in the log; GitHub's own secret scanning with push protection runs
  # as well (repository settings).
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.21.2 over the history and the files
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --verbose .
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --no-banner .
