# Makes a release on request: Actions › release › Run workflow (on main).
# Checks the version, requires the test workflow to have passed for this commit (waiting up to 20
# minutes for it), runs the tests, builds the .deb, the .rpm and the source archive and creates
# the tag vVERSION with a GitHub release (packages, archive, SHA256SUMS, signed build provenance,
# notes from CHANGELOG.md).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 (empty: the VERSION in plugin/settings.js)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write       # tag and release
  id-token: write       # signing the build provenance
  attestations: write   # storing the build provenance
  actions: read         # the test workflow's result for this commit

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(sh tools/check-version.sh)
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from VERSION in plugin/settings.js ($code). Change plugin/settings.js first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every job of the test workflow on this very commit, not only the required check "test":
      # also Python 3.8 and the end-to-end run with ntfy and postfix. The run may still be
      # going, and for a while after it ends the list of runs can show it unfinished or not at all
      # (Update Gaps 0.3.0: 20 seconds after the run ended). So ask every 20 seconds, for at most
      # 20 minutes; a finished run without success stops the release at once.
      - name: The test workflow passed for this commit
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          limit=$(( $(date +%s) + 1200 ))
          while :; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json status,conclusion,url \
              --jq '.[] | "\(.status)/\(.conclusion) \(.url)"') || run=
            state=${run%% *}
            case $state in
              completed/success)
                echo "The test workflow passed for $GITHUB_SHA: ${run#* }"
                exit 0 ;;
              completed/*)
                echo "::error::The test workflow did not pass for $GITHUB_SHA (${state#completed/}): ${run#* }. Fix it first."
                exit 1 ;;
            esac
            state=${state%/}
            if [ "$(date +%s)" -ge "$limit" ]; then
              echo "::error::The test workflow has not passed for $GITHUB_SHA within 20 minutes (${state:-no run}). Wait for it, then start the release again."
              exit 1
            fi
            echo "Waiting for the test workflow (${state:-no run listed yet})."
            sleep 20
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Tests
        run: make check

      - name: Packages (.deb, .rpm) and source archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make packages
          make dist
          { sha256sum "cockpit-host-settings-$VERSION.tar.gz"; (cd dist && sha256sum *.deb *.rpm); } > SHA256SUMS

      - name: Build provenance for the packages and the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cockpit-host-settings-${{ steps.version.outputs.version }}.tar.gz
            dist/*.deb
            dist/*.rpm

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh tools/release-notes.sh "$VERSION" > notes.md
          upstream=$(printf '%s' "$VERSION" | tr '-' '~')
          deb=cockpit-host-settings_${upstream}-1_all.deb
          rpm=cockpit-host-settings-${upstream}-1.noarch.rpm
          {
            echo
            echo "### Install"
            echo
            # Until Azentrius/packages lists Host Settings; then the sentence on the package
            # repository comes first again, as in the other add-ons.
            echo "The Azentrius package repository (https://packages.azentrius.com) does not carry Host Settings yet. Install it from the files of this release: download the package and \`SHA256SUMS\`, check that the download is complete and that this repository's release workflow built it, then install it:"
            echo
            echo '```sh'
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "gh attestation verify $deb --repo $GITHUB_REPOSITORY"
            echo "sudo apt install ./$deb        # or: sudo dnf install ./$rpm"
            echo '```'
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -- --target "$GITHUB_SHA" --title "Host Settings $VERSION" --notes-file notes.md
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          fi
          gh release create "v$VERSION" dist/*.deb dist/*.rpm "cockpit-host-settings-$VERSION.tar.gz" SHA256SUMS "$@"
