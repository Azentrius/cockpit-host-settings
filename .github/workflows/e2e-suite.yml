name: e2e-suite

# E2E-1, the shared suite, with this repository's commit as the candidate for Host Settings and
# the test: the reusable workflow suite.yml beside this file (its comment says what it does).
# Status Board and Security Monitor come from the released combination in
# test/e2e-suite/suite-manifest.json. A pull request tests its head commit (test and product
# alike); a push on main tests the merged commit, which the release requires (release.yml).
#
# By hand (Actions › e2e-suite › Run workflow) a branch's test runs with any combination: each
# input is a full commit that replaces the candidate or the manifest's commit of that product,
# so candidates that belong together (pull requests in two repositories) are tested together.
#
# The check to require is "e2e-suite / gate".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      security_monitor:
        description: Commit of Azentrius/cockpit-security-monitor to build (all 40 hex digits; empty - the manifest)
        required: false
        default: ""
      host_settings:
        description: Commit of Azentrius/cockpit-host-settings to build (all 40 hex digits; empty - the commit of the run)
        required: false
        default: ""
      status_board:
        description: Commit of Azentrius/cockpit-status-board to build (all 40 hex digits; empty - the manifest)
        required: false
        default: ""

permissions:
  contents: read

# A new push to a pull request replaces its running suite; runs on main and by hand never cancel
# each other (each commit on main keeps its own run for the release).
concurrency:
  group: e2e-suite-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  suite:
    name: e2e-suite
    uses: ./.github/workflows/suite.yml
    with:
      suite: ${{ github.event.pull_request.head.sha || github.sha }}
      security_monitor: ${{ inputs.security_monitor }}
      host_settings: ${{ inputs.host_settings }}
      status_board: ${{ inputs.status_board }}
